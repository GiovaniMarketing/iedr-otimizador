  redis:
    image: redis:7
    container_name: iedr_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - iedr_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: iedr_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    networks:
      - iedr_network

  # --- ADIÇÕES PARA FUNCIONAMENTO DO APP (COM MAPEAMENTO DE VOLUMES) ---

  auth-service:
    build: 
      context: F:/Plataforma_IEDR/backend/auth-service
      dockerfile: Dockerfile
    container_name: iedr_auth_service
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - F:/Plataforma_IEDR/backend/auth-service:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672/
    # O PULO DO GATO: Remova ou comente as linhas abaixo
    # depends_on:
    #   - postgres
    #   - redis
    #   - rabbitmq
    networks:
      - iedr_network

  frontend:
    build:
      context: F:/Plataforma_IEDR/frontend
      dockerfile: Dockerfile
    container_name: iedr_frontend
    restart: always
    ports:
      - "5173:5173"
    # Adicionado volume também no frontend para facilitar seus testes
    volumes:
      - F:/Plataforma_IEDR/frontend:/app
      - /app/node_modules # Evita conflito de bibliotecas entre Windows e Docker
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - auth-service
    networks:
      - iedr_network

volumes:
  postgres_data:

networks:
  iedr_network:
    driver: bridge